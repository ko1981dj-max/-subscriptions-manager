<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>نظام إدارة الاشتراكات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root{
    --ink:#12232b;
    --ink-soft:#3d5560;
    --paper:#f4f7f6;
    --panel:#ffffff;
    --line:#dde5e3;
    --teal:#0e5352;
    --teal-deep:#0a3d3c;
    --teal-soft:#e4efee;
    --gold:#b8862e;
    --gold-soft:#f4e9d8;
    --red:#a3323b;
    --red-soft:#fbe9ea;
    --green:#2f7d4f;
    --green-soft:#e7f4ec;
    --amber:#b3760e;
    --amber-soft:#fdf1de;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'IBM Plex Sans Arabic','Tajawal',sans-serif;
    background:var(--paper);
    color:var(--ink);
    direction:rtl;
  }
  h1,h2,h3,h4{font-family:'Tajawal',sans-serif; margin:0;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::selection{background:var(--gold-soft);}

  #root{min-height:100vh;}

  /* ---- Layout ---- */
  .app-shell{display:flex; min-height:100vh;}
  .sidebar{
    width:250px; flex-shrink:0; background:var(--teal-deep);
    color:#eaf3f2; display:flex; flex-direction:column;
    padding:22px 16px; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:0 8px 20px 8px; border-bottom:1px solid rgba(255,255,255,.12); margin-bottom:14px;}
  .brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--gold),#8a6620); display:flex;align-items:center;justify-content:center;font-weight:900;color:#241a08;font-size:15px;}
  .brand-text{font-weight:700; font-size:15px; line-height:1.3;}
  .brand-text span{display:block; font-size:11px; font-weight:400; opacity:.65;}
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:9px;
    color:#cfe3e0; text-decoration:none; font-size:14.5px; margin-bottom:3px; border:none; background:none; width:100%; text-align:right;
    transition:background .15s;
  }
  .nav-item .ic{width:18px;text-align:center;opacity:.85;font-size:15px;}
  .nav-item:hover{background:rgba(255,255,255,.07); color:#fff;}
  .nav-item.active{background:var(--gold); color:#2a1e08; font-weight:700;}
  .nav-sep{height:1px;background:rgba(255,255,255,.1); margin:12px 4px;}
  .nav-section-label{font-size:11px; opacity:.5; padding:6px 12px 4px; letter-spacing:.03em;}
  .sidebar-footer{margin-top:auto; padding-top:14px; border-top:1px solid rgba(255,255,255,.12);}
  .user-chip{display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:9px; background:rgba(255,255,255,.06);}
  .user-chip .av{width:30px;height:30px;border-radius:50%;background:var(--gold-soft); color:var(--gold); display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
  .user-chip .meta{flex:1; min-width:0;}
  .user-chip .name{font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .user-chip .role{font-size:11px; opacity:.6;}
  .logout-btn{background:none;border:none;color:#cfe3e0;font-size:16px;padding:4px;opacity:.7;}
  .logout-btn:hover{opacity:1;}

  .main{flex:1; min-width:0; padding:26px 32px 60px;}
  .page-header{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:10px;}
  .page-title{font-size:22px; font-weight:900; color:var(--teal-deep);}
  .page-subtitle{font-size:13px; color:var(--ink-soft); margin-top:3px;}

  .btn{border:none; border-radius:9px; padding:9px 16px; font-size:13.5px; font-weight:600; display:inline-flex; align-items:center; gap:6px;}
  .btn-primary{background:var(--teal); color:#fff;}
  .btn-primary:hover{background:var(--teal-deep);}
  .btn-gold{background:var(--gold); color:#2a1e08;}
  .btn-gold:hover{background:#a1752a;}
  .btn-ghost{background:var(--panel); color:var(--ink); border:1px solid var(--line);}
  .btn-ghost:hover{background:#eef2f1;}
  .btn-danger{background:var(--red-soft); color:var(--red);}
  .btn-danger:hover{background:#f6d7d9;}
  .btn-sm{padding:5px 10px; font-size:12.5px; border-radius:7px;}

  /* ---- Cards / KPI ---- */
  .grid{display:grid; gap:16px;}
  .kpi-grid{grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); margin-bottom:22px;}
  .kpi{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 18px; position:relative; overflow:hidden;}
  .kpi::before{content:'';position:absolute; inset-inline-start:0; top:0; bottom:0; width:4px; background:var(--accent,var(--teal));}
  .kpi .label{font-size:12.5px; color:var(--ink-soft); font-weight:500; margin-bottom:6px;}
  .kpi .value{font-size:23px; font-weight:900; color:var(--teal-deep);}
  .kpi .sub{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:20px;}
  .panel-title{font-size:15px; font-weight:700; margin-bottom:14px; color:var(--teal-deep);}

  /* ---- Table ---- */
  .table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:12px;}
  table{width:100%; border-collapse:collapse; background:var(--panel); font-size:13px; min-width:640px;}
  thead th{background:var(--teal-soft); color:var(--teal-deep); font-weight:700; padding:10px 12px; text-align:right; white-space:nowrap; border-bottom:1px solid var(--line); position:sticky; top:0;}
  tbody td{padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap; color:var(--ink);}
  tbody tr:hover{background:#f7faf9;}
  tbody tr:last-child td{border-bottom:none;}

  .badge{display:inline-block; padding:3px 10px; border-radius:99px; font-size:11.5px; font-weight:700;}
  .badge-green{background:var(--green-soft); color:var(--green);}
  .badge-amber{background:var(--amber-soft); color:var(--amber);}
  .badge-red{background:var(--red-soft); color:var(--red);}
  .badge-gray{background:#eef1f0; color:#5b6b6a;}

  .toolbar{display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap;}
  .search-input{padding:9px 14px; border-radius:9px; border:1px solid var(--line); font-size:13.5px; min-width:230px; background:#fff;}
  .search-input:focus{outline:2px solid var(--teal); outline-offset:1px;}
  select.filter-select{padding:9px 12px; border-radius:9px; border:1px solid var(--line); background:#fff; font-size:13.5px;}

  .tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:18px; flex-wrap:wrap;}
  .tab{padding:9px 16px; font-size:13.5px; font-weight:600; color:var(--ink-soft); background:none; border:none; border-bottom:2px solid transparent; margin-bottom:-1px;}
  .tab.active{color:var(--teal-deep); border-bottom-color:var(--gold);}

  /* ---- Modal ---- */
  .modal-overlay{position:fixed; inset:0; background:rgba(10,20,20,.45); display:flex; align-items:flex-start; justify-content:center; padding:40px 20px; z-index:50; overflow-y:auto;}
  .modal{background:#fff; border-radius:16px; padding:24px 26px; width:100%; max-width:560px; box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .modal h3{font-size:17px; font-weight:800; color:var(--teal-deep); margin-bottom:16px;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .form-field{display:flex; flex-direction:column; gap:5px; margin-bottom:10px;}
  .form-field.full{grid-column:1 / -1;}
  .form-field label{font-size:12.5px; font-weight:600; color:var(--ink-soft);}
  .form-field input, .form-field select, .form-field textarea{
    padding:9px 11px; border-radius:8px; border:1px solid var(--line); font-size:13.5px; background:#fbfcfc;
  }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus{outline:2px solid var(--teal); outline-offset:0; border-color:var(--teal);}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:18px;}

  .empty-state{padding:50px 20px; text-align:center; color:var(--ink-soft);}
  .empty-state .ic{font-size:34px; margin-bottom:10px;}

  .login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 30% 20%, #123f3e 0%, var(--teal-deep) 55%, #071e1d 100%); padding:20px;}
  .login-card{background:#fff; border-radius:18px; padding:34px 30px; width:100%; max-width:390px; box-shadow:0 30px 80px rgba(0,0,0,.35);}
  .login-brand{text-align:center; margin-bottom:22px;}
  .login-brand .mark{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--gold),#8a6620); margin:0 auto 12px; display:flex; align-items:center; justify-content:center; color:#241a08; font-weight:900; font-size:22px;}
  .login-brand h1{font-size:18px; font-weight:900; color:var(--teal-deep);}
  .login-brand p{font-size:12.5px; color:var(--ink-soft); margin-top:4px;}
  .login-toggle{display:flex; background:#f0f3f2; border-radius:10px; padding:4px; margin-bottom:18px;}
  .login-toggle button{flex:1; padding:8px; border:none; background:none; border-radius:7px; font-size:13px; font-weight:700; color:var(--ink-soft);}
  .login-toggle button.active{background:#fff; color:var(--teal-deep); box-shadow:0 1px 3px rgba(0,0,0,.1);}
  .login-error{background:var(--red-soft); color:var(--red); font-size:12.5px; padding:9px 12px; border-radius:8px; margin-bottom:12px;}
  .login-info{background:var(--teal-soft); color:var(--teal-deep); font-size:12px; padding:9px 12px; border-radius:8px; margin-top:14px; line-height:1.6;}

  .chart-box{position:relative; height:280px;}
  .two-col{display:grid; grid-template-columns:1.3fr 1fr; gap:18px;}
  @media (max-width:900px){ .two-col{grid-template-columns:1fr;} .form-grid{grid-template-columns:1fr;} .sidebar{position:fixed; z-index:40; transform:translateX(100%); transition:transform .2s;} .sidebar.open{transform:translateX(0);} .main{padding:18px;} }

  .renewal-groups{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:20px;}
  .renewal-chip{border-radius:12px; padding:12px 14px; border:1px solid var(--line); cursor:pointer; background:#fff;}
  .renewal-chip.selected{border-color:var(--gold); background:var(--gold-soft);}
  .renewal-chip .n{font-size:20px; font-weight:900; color:var(--teal-deep);}
  .renewal-chip .l{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}

  .icon-btn{background:none;border:none;padding:5px;border-radius:6px;color:var(--ink-soft);font-size:14px;}
  .icon-btn:hover{background:#eef2f1; color:var(--ink);}
  .mobile-toggle{display:none; position:fixed; top:14px; left:14px; z-index:45; background:var(--teal-deep); color:#fff; border:none; border-radius:9px; width:38px; height:38px; font-size:18px;}
  @media (max-width:900px){ .mobile-toggle{display:block;} }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

const SUPABASE_URL = 'https://jgrjuyddamkkbytrhcje.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_vS8zwlBxljt-F3OH6FM1aQ_S2CGkkl9';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ---------- ثوابت ----------
const EXPENSE_TYPES = ['واجهات برمجية','إعلانات','استضافة','رواتب','برامج وخدمات','بنية تحتية','رسوم دفع','أخرى'];
const OPERATION_TYPES = ['اشتراك جديد','تجديد','بيع لموزع','إيراد آخر'];
const DIST_PERIODS = ['شهري','كل شهرين','كل 3 أشهر','غير منتظم'];
const STATUS_OPTIONS = ['اول سنة','تجديد','لم يدفع بعد','باقي سنة','ملاحظات'];
const ROLE_LABELS = { super_admin:'مدير عام', admin:'مدير', accountant:'محاسب', sales_employee:'موظف مبيعات', viewer:'مشاهدة فقط' };

const NAV = [
  { key:'dashboard', label:'لوحة التحكم', icon:'⬛' },
  { key:'newSub', label:'اشتراك جديد', icon:'➕' },
  { key:'customers', label:'العملاء', icon:'👤' },
  { key:'subs2025', label:'اشتراكات 2025', icon:'📄' },
  { key:'subs2026', label:'اشتراكات 2026', icon:'📄' },
  { key:'renewals', label:'التجديدات', icon:'⏰' },
  { key:'notRenewed', label:'لم يجدد', icon:'❌' },
  { key:'unpaid', label:'لم يدفع بعد', icon:'⚠️' },
  { key:'paymentMethods', label:'طرق الدفع', icon:'💳' },
  { key:'distributors', label:'الموزعون', icon:'🏬' },
  { key:'revenues', label:'الإيرادات', icon:'💶' },
  { key:'expenses', label:'المصاريف', icon:'🧾' },
  { key:'pnl', label:'الأرباح والخسائر', icon:'📈' },
  { key:'monthlySales', label:'المبيعات الشهرية', icon:'🗓️' },
  { key:'subCosts', label:'تكلفة الاشتراكات', icon:'💰' },
  { key:'reports', label:'التقارير', icon:'📊' },
];

// ---------- أدوات مساعدة ----------
function fmtEUR(n){
  if(n===null||n===undefined||isNaN(n)) return '€0';
  return '€' + Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
}
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d);
  if(isNaN(dt)) return '—';
  return dt.toLocaleDateString('ar-EG',{year:'numeric',month:'2-digit',day:'2-digit'});
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysUntil(dateStr){
  if(!dateStr) return null;
  const end = new Date(dateStr); const now = new Date(todayISO());
  return Math.round((end-now)/86400000);
}
function monthKey(dateStr){ return dateStr ? dateStr.slice(0,7) : null; }
function uid(){ return crypto.randomUUID ? crypto.randomUUID() : 'id-'+Math.random().toString(36).slice(2); }

function renewalBucket(days){
  if(days===null) return null;
  if(days < 0) return 'expired';
  if(days === 0) return 'today';
  if(days <= 3) return 'd3';
  if(days <= 7) return 'd7';
  if(days <= 14) return 'd14';
  if(days <= 30) return 'd30';
  return null;
}
const BUCKET_META = {
  today:{label:'ينتهي اليوم', color:'red'},
  d3:{label:'خلال 3 أيام', color:'red'},
  d7:{label:'خلال 7 أيام', color:'amber'},
  d14:{label:'خلال 14 يوماً', color:'amber'},
  d30:{label:'خلال 30 يوماً', color:'green'},
  expired:{label:'منتهي', color:'gray'},
};

// حساب آخر اشتراك لكل عميل (لأغراض التجديد والملف الشخصي)
function latestSubscriptionPerCustomer(subscriptions){
  const map = {};
  subscriptions.forEach(s=>{
    if(!s.start_date) return;
    const cur = map[s.customer_id];
    if(!cur || new Date(s.start_date) > new Date(cur.start_date)){
      map[s.customer_id] = s;
    }
  });
  return map;
}

function uniqueValues(list, field){
  const set = new Set();
  list.forEach(item=>{
    const v = item[field];
    if(v && String(v).trim() !== '') set.add(String(v).trim());
  });
  return Array.from(set).sort((a,b)=>a.localeCompare(b,'ar'));
}

function useToast(){
  const [toast,setToast] = useState(null);
  const show = (msg,type='ok')=>{ setToast({msg,type}); setTimeout(()=>setToast(null), 3000); };
  return [toast, show];
}

function SelectOrOther({options, value, onChange, placeholder}){
  const isKnown = value==='' || options.includes(value);
  const [customMode,setCustomMode] = useState(!isKnown && value);
  if(customMode){
    return (
      <div style={{display:'flex',gap:6}}>
        <input value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={{flex:1}} />
        <button type="button" className="btn btn-ghost btn-sm" onClick={()=>{setCustomMode(false); onChange('');}}>قائمة</button>
      </div>
    );
  }
  return (
    <select value={value} onChange={e=>{ if(e.target.value==='__other__'){ setCustomMode(true); onChange(''); } else { onChange(e.target.value); } }}>
      <option value="">— اختر —</option>
      {options.map(o=><option key={o} value={o}>{o}</option>)}
      <option value="__other__">✎ أخرى (كتابة يدوية)</option>
    </select>
  );
}

function Toast({toast}){
  if(!toast) return null;
  const bg = toast.type==='err' ? 'var(--red)' : 'var(--teal)';
  return (
    <div style={{position:'fixed',bottom:20,insetInlineStart:20,zIndex:100,background:bg,color:'#fff',padding:'11px 18px',borderRadius:10,fontSize:13.5,fontWeight:600,boxShadow:'0 10px 30px rgba(0,0,0,.25)'}}>
      {toast.msg}
    </div>
  );
}

function LoginScreen(){
  const [mode,setMode] = useState('login');
  const [email,setEmail] = useState('');
  const [password,setPassword] = useState('');
  const [fullName,setFullName] = useState('');
  const [err,setErr] = useState('');
  const [busy,setBusy] = useState(false);

  async function submit(e){
    e.preventDefault();
    setErr(''); setBusy(true);
    try{
      if(mode==='login'){
        const {error} = await sb.auth.signInWithPassword({email,password});
        if(error) throw error;
      } else {
        const {error} = await sb.auth.signUp({email,password,options:{data:{full_name:fullName}}});
        if(error) throw error;
        setErr('__signup_ok__');
      }
    }catch(ex){
      setErr(ex.message || 'حدث خطأ غير متوقع');
    }finally{ setBusy(false); }
  }

  return (
    <div className="login-wrap">
      <div className="login-card">
        <div className="login-brand">
          <div className="mark">اش</div>
          <h1>نظام إدارة الاشتراكات</h1>
          <p>تسجيل الدخول لإدارة العملاء والاشتراكات والمالية</p>
        </div>
        <div className="login-toggle">
          <button className={mode==='login'?'active':''} onClick={()=>{setMode('login');setErr('');}}>تسجيل الدخول</button>
          <button className={mode==='signup'?'active':''} onClick={()=>{setMode('signup');setErr('');}}>حساب جديد</button>
        </div>
        {err==='__signup_ok__' && <div className="login-info">تم إنشاء الحساب! تحقق من بريدك الإلكتروني إذا طُلب تأكيد، ثم سجّل الدخول. سيتم منحك صلاحية "موظف مبيعات" افتراضياً، ويمكن لمديرك ترقيتها من صفحة الصلاحيات في قاعدة البيانات.</div>}
        {err && err!=='__signup_ok__' && <div className="login-error">{err}</div>}
        <form onSubmit={submit}>
          {mode==='signup' && (
            <div className="form-field">
              <label>الاسم الكامل</label>
              <input value={fullName} onChange={e=>setFullName(e.target.value)} required />
            </div>
          )}
          <div className="form-field">
            <label>البريد الإلكتروني</label>
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)} required />
          </div>
          <div className="form-field">
            <label>كلمة المرور</label>
            <input type="password" value={password} onChange={e=>setPassword(e.target.value)} required minLength={6} />
          </div>
          <button className="btn btn-primary" style={{width:'100%',justifyContent:'center',marginTop:8,padding:'11px'}} disabled={busy}>
            {busy ? 'جارٍ التنفيذ...' : (mode==='login' ? 'دخول' : 'إنشاء الحساب')}
          </button>
        </form>
      </div>
    </div>
  );
}

function Modal({title,onClose,children,wide}){
  return (
    <div className="modal-overlay" onMouseDown={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal" style={wide?{maxWidth:720}:{}}>
        <h3>{title}</h3>
        {children}
      </div>
    </div>
  );
}

function ConfirmBar({onConfirm,onCancel,text}){
  return (
    <div className="modal-overlay" onMouseDown={e=>{ if(e.target===e.currentTarget) onCancel(); }}>
      <div className="modal" style={{maxWidth:380}}>
        <h3>تأكيد الحذف</h3>
        <p style={{fontSize:13.5,color:'var(--ink-soft)',marginBottom:16}}>{text}</p>
        <div className="modal-actions">
          <button className="btn btn-ghost" onClick={onCancel}>إلغاء</button>
          <button className="btn btn-danger" onClick={onConfirm}>حذف نهائياً</button>
        </div>
      </div>

}

function Field({label,children}){
  return <div className="form-field"><label>{label}</label>{children}</div>;
}

function useChart(canvasRef, config, deps){
  useEffect(()=>{
    if(!canvasRef.current) return;
    const chart = new Chart(canvasRef.current, config);
    return ()=>chart.destroy();
  }, deps);
}

function Dashboard({customers, subscriptions, revenues, expenses, distributors}){
  const revLine = useRef(), expLine = useRef();
  const totalRevenue = useMemo(()=> revenues.reduce((s,r)=>s+Number(r.total||0),0), [revenues]);
  const totalExpenses = useMemo(()=> expenses.reduce((s,e)=>s+Number(e.amount||0),0), [expenses]);
  const netProfit = totalRevenue - totalExpenses;

  const activeSubs = subscriptions.filter(s=> s.end_date && daysUntil(s.end_date) >= 0).length;
  const expiredSubs = subscriptions.filter(s=> s.end_date && daysUntil(s.end_date) < 0).length;

  const latestMap = useMemo(()=>latestSubscriptionPerCustomer(subscriptions), [subscriptions]);
  const renewalList = useMemo(()=> Object.values(latestMap).map(s=>({...s, days:daysUntil(s.end_date)})).filter(s=>renewalBucket(s.days) && renewalBucket(s.days)!=='expired'), [latestMap]);
  const renewalCount = renewalList.length;
  const renewalValue = renewalList.reduce((s,r)=>s+Number(r.price||0),0);

  const curMonth = todayISO().slice(0,7);
  const monthRevenue = revenues.filter(r=>monthKey(r.date)===curMonth).reduce((s,r)=>s+Number(r.total||0),0);
  const monthExpenses = expenses.filter(e=>monthKey(e.date)===curMonth).reduce((s,e)=>s+Number(e.amount||0),0);
  const monthProfit = monthRevenue - monthExpenses;

  // آخر 12 شهر
  const months = useMemo(()=>{
    const arr=[];
    const d = new Date();
    for(let i=11;i>=0;i--){
      const dt = new Date(d.getFullYear(), d.getMonth()-i, 1);
      arr.push(dt.toISOString().slice(0,7));
    }
    return arr;
  },[]);
  const revByMonth = months.map(m => revenues.filter(r=>monthKey(r.date)===m).reduce((s,r)=>s+Number(r.total||0),0));
  const expByMonth = months.map(m => expenses.filter(e=>monthKey(e.date)===m).reduce((s,e)=>s+Number(e.amount||0),0));
  const profitByMonth = months.map((m,i)=> revByMonth[i]-expByMonth[i]);
  const monthLabels = months.map(m=>{
    const [y,mo]=m.split('-');
    return new Intl.DateTimeFormat('ar-EG',{month:'short'}).format(new Date(y,mo-1,1)) + ' ' + y.slice(2);
  });

  useChart(revLine, {
    type:'line',
    data:{ labels:monthLabels, datasets:[
      {label:'الإيرادات', data:revByMonth, borderColor:'#0e5352', backgroundColor:'rgba(14,83,82,.12)', fill:true, tension:.35},
      {label:'المصاريف', data:expByMonth, borderColor:'#a3323b', backgroundColor:'rgba(163,50,59,.08)', fill:true, tension:.35},
    ]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom', labels:{font:{family:'IBM Plex Sans Arabic'}}}}, scales:{y:{ticks:{callback:v=>'€'+v}}} }
  }, [revByMonth.join(','), expByMonth.join(',')]);

  useChart(expLine, {
    type:'bar',
    data:{ labels:monthLabels, datasets:[{label:'صافي الربح', data:profitByMonth, backgroundColor: profitByMonth.map(v=> v>=0 ? '#2f7d4f' : '#a3323b')}] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{ticks:{callback:v=>'€'+v}}} }
  }, [profitByMonth.join(',')]);

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">لوحة التحكم</div>
          <div className="page-subtitle">نظرة عامة على أداء العمل حتى {fmtDate(todayISO())}</div>
        </div>
      </div>

      <div className="grid kpi-grid">
        <div className="kpi" style={{'--accent':'var(--teal)'}}><div className="label">إجمالي الإيرادات</div><div className="value">{fmtEUR(totalRevenue)}</div></div>
        <div className="kpi" style={{'--accent':'var(--red)'}}><div className="label">إجمالي المصاريف</div><div className="value">{fmtEUR(totalExpenses)}</div></div>
        <div className="kpi" style={{'--accent':'var(--gold)'}}><div className="label">صافي الأرباح</div><div className="value">{fmtEUR(netProfit)}</div></div>
        <div className="kpi" style={{'--accent':'var(--teal)'}}><div className="label">عدد العملاء</div><div className="value">{customers.length}</div></div>
        <div className="kpi" style={{'--accent':'var(--green)'}}><div className="label">اشتراكات نشطة</div><div className="value">{activeSubs}</div></div>
        <div className="kpi" style={{'--accent':'var(--red)'}}><div className="label">اشتراكات منتهية</div><div className="value">{expiredSubs}</div></div>
        <div className="kpi" style={{'--accent':'var(--amber)'}}><div className="label">عملاء بحاجة تجديد</div><div className="value">{renewalCount}</div></div>
        <div className="kpi" style={{'--accent':'var(--amber)'}}><div className="label">قيمة التجديدات المتوقعة</div><div className="value">{fmtEUR(renewalValue)}</div></div>
        <div className="kpi" style={{'--accent':'var(--teal)'}}><div className="label">إيرادات الشهر</div><div className="value">{fmtEUR(monthRevenue)}</div></div>
        <div className="kpi" style={{'--accent':'var(--red)'}}><div className="label">مصاريف الشهر</div><div className="value">{fmtEUR(monthExpenses)}</div></div>
        <div className="kpi" style={{'--accent':'var(--gold)'}}><div className="label">أرباح الشهر</div><div className="value">{fmtEUR(monthProfit)}</div></div>
        <div className="kpi" style={{'--accent':'var(--teal)'}}><div className="label">عدد الموزعين</div><div className="value">{distributors.length}</div></div>
      </div>

      <div className="two-col">
        <div className="panel">
          <div className="panel-title">الإيرادات والمصاريف — آخر 12 شهراً</div>
          <div className="chart-box"><canvas ref={revLine}></canvas></div>
        </div>
        <div className="panel">
          <div className="panel-title">صافي الربح الشهري</div>
          <div className="chart-box"><canvas ref={expLine}></canvas></div>
        </div>
      </div>
    </div>
  );
}

function CustomersPage({customers, subscriptions, reload, showToast, canWrite}){
  const [q,setQ] = useState('');
  const [editing,setEditing] = useState(null);
  const [adding,setAdding] = useState(false);
  const [expanded,setExpanded] = useState(null);
  const [deleting,setDeleting] = useState(null);

  const subsByCustomer = useMemo(()=>{
    const m={};
    subscriptions.forEach(s=>{ (m[s.customer_id] = m[s.customer_id]||[]).push(s); });
    return m;
  },[subscriptions]);

  const filtered = useMemo(()=>{
    const term = q.trim().toLowerCase();
    if(!term) return customers;
    return customers.filter(c => (c.name||'').toLowerCase().includes(term) || (c.phone||'').includes(term));
  },[customers,q]);

  async function save(form){
    try{
      if(form.id){
        const {error} = await sb.from('customers').update({name:form.name,phone:form.phone,email:form.email,notes:form.notes}).eq('id',form.id);
        if(error) throw error;
      } else {
        const {error} = await sb.from('customers').insert({name:form.name,phone:form.phone,email:form.email,notes:form.notes});
        if(error) throw error;
      }
      showToast('تم حفظ بيانات العميل');
      setEditing(null); setAdding(false); reload();
    }catch(ex){ showToast(ex.message,'err'); }
  }

  async function del(id){
    try{
      // نحذف أولاً كل الإيرادات المرتبطة بهذا العميل، لأن حذف العميل لا يحذفها تلقائياً
      const {error: revDelErr} = await sb.from('revenues').delete().eq('customer_id', id);
      if(revDelErr) throw revDelErr;
      const {error} = await sb.from('customers').delete().eq('id',id);
      if(error) throw error;
      showToast('تم حذف العميل وكل بياناته المرتبطة (الاشتراكات والإيرادات)'); setDeleting(null); reload();
    }catch(ex){ showToast(ex.message,'err'); }
  }

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">العملاء</div>
          <div className="page-subtitle">{customers.length} عميل مسجّل — كل عميل يمثل جهازاً/حساباً فريداً حسب الماك ادرس</div>
        </div>
        {canWrite && <button className="btn btn-gold" onClick={()=>setAdding(true)}>+ إضافة عميل</button>}
      </div>

      <div className="toolbar">
        <input className="search-input" placeholder="ابحث بالاسم أو رقم الهاتف..." value={q} onChange={e=>setQ(e.target.value)} />
      </div>

      <div className="table-wrap">
        <table>
          <thead><tr>
            <th></th><th>الاسم</th><th>رقم الهاتف</th><th>البريد</th><th>عدد الاشتراكات</th><th>آخر اشتراك ينتهي</th><th></th>
          </tr></thead>
          <tbody>
            {filtered.map(c=>{
              const subs = subsByCustomer[c.id] || [];
              const latest = subs.slice().sort((a,b)=> new Date(b.start_date||0)-new Date(a.start_date||0))[0];
              return (
                <React.Fragment key={c.id}>
                <tr>
                  <td><button className="icon-btn" onClick={()=>setExpanded(expanded===c.id?null:c.id)}>{expanded===c.id?'▲':'▼'}</button></td>
                  <td style={{fontWeight:600}}>{c.name}</td>
                  <td>{c.phone||'—'}</td>
                  <td>{c.email||'—'}</td>
                  <td>{subs.length}</td>
                  <td>{latest?fmtDate(latest.end_date):'—'}</td>
                  <td>
                    {canWrite && <>
                      <button className="icon-btn" onClick={()=>setEditing(c)}>✎</button>
                      <button className="icon-btn" onClick={()=>setDeleting(c)}>🗑</button>
                    </>}
                  </td>
                </tr>
                {expanded===c.id && (
                  <tr><td colSpan={7} style={{background:'#f7faf9', padding:'12px 16px'}}>
                    {subs.length===0 ? <span style={{color:'var(--ink-soft)'}}>لا توجد اشتراكات مسجّلة</span> : (
                      <table style={{minWidth:'auto'}}>
                        <thead><tr><th>ماك ادرس</th><th>البرنامج</th><th>السيرفر</th><th>البداية</th><th>النهاية</th><th>السعر</th><th>طريقة الدفع</th><th>الحالة</th><th>المصدر</th></tr></thead>
                        <tbody>
                          {subs.slice().sort((a,b)=>new Date(b.start_date||0)-new Date(a.start_date||0)).map(s=>(
                            <tr key={s.id}>
                              <td style={{fontFamily:'monospace',fontSize:12}}>{s.mac_address||'—'}</td>
                              <td>{s.program||'—'}</td><td>{s.server||'—'}</td><td>{fmtDate(s.start_date)}</td><td>{fmtDate(s.end_date)}</td>
                              <td>{fmtEUR(s.price)}</td><td>{s.payment_method||'—'}</td><td>{s.status||'—'}</td><td>{s.source_sheet||'—'}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    )}
                  </td></tr>
                )}
                </React.Fragment>
              );
            })}
            {filtered.length===0 && <tr><td colSpan={7}><div className="empty-state"><div className="ic">👤</div>لا يوجد عملاء مطابقون</div></td></tr>}
          </tbody>
        </table>
      </div>

      {(adding || editing) && <CustomerForm initial={editing} onSave={save} onCancel={()=>{setAdding(false);setEditing(null);}} />}
      {deleting && <ConfirmBar text={`سيتم حذف العميل "${deleting.name}" وكل اشتراكاته المرتبطة به نهائياً.`} onConfirm={()=>del(deleting.id)} onCancel={()=>setDeleting(null)} />}
    </div>
  );
}

function NewSubscriptionPage({customers, subscriptions, reload, showToast, setPage}){
  const programOptions = useMemo(()=>uniqueValues(subscriptions,'program'), [subscriptions]);
  const serverOptions = useMemo(()=>uniqueValues(subscriptions,'server'), [subscriptions]);
  const paymentOptions = useMemo(()=>uniqueValues(subscriptions,'payment_method'), [subscriptions]);

  const blank = {
    customerMode:'existing', customer_id:'', newName:'', newPhone:'', newEmail:'',
    mac_address:'', program:'', server:'', status:'اول سنة',
    start_date:todayISO(), end_date:'', price:'', cost:'', payment_method:'', notes:'',
    source_sheet:`اشتراك ${todayISO().slice(0,4)}`,
  };
  const [form,setForm] = useState(blank);
  const [custQ,setCustQ] = useState('');
  const [busy,setBusy] = useState(false);
  const [lastSaved,setLastSaved] = useState(null);
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));

  const filteredCustomers = useMemo(()=>{
    const term = custQ.trim().toLowerCase();
    if(!term) return customers.slice(0,50);
    return customers.filter(c=>(c.name||'').toLowerCase().includes(term) || (c.phone||'').includes(term)).slice(0,50);
  },[customers,custQ]);

  async function submit(e){
    e.preventDefault();
    setBusy(true);
    setLastSaved(null);
    try{
      let customerId = form.customer_id;
      let customerName = customers.find(c=>c.id===form.customer_id)?.name;
      if(form.customerMode==='new'){
        if(!form.newName.trim()){ showToast('الرجاء إدخال اسم العميل الجديد','err'); setBusy(false); return; }
        const {data,error} = await sb.from('customers').insert({name:form.newName.trim(), phone:form.newPhone||null, email:form.newEmail||null}).select().single();
        if(error) throw error;
        customerId = data.id;
        customerName = data.name;
      }
      if(!customerId){ showToast('الرجاء اختيار عميل موجود أو إدخال بيانات عميل جديد','err'); setBusy(false); return; }

      const price = form.price===''?null:Number(form.price);
      const payload = {
        customer_id:customerId, mac_address:form.mac_address||null, program:form.program||null, server:form.server||null,
        status:form.status||null, start_date:form.start_date||null, end_date:form.end_date||null,
        price, cost: form.cost===''?null:Number(form.cost), payment_method:form.payment_method||null,
        notes:form.notes||null, source_sheet:form.source_sheet,
      };
      const {data:subData, error:subErr} = await sb.from('subscriptions').insert(payload).select().single();
      if(subErr) throw subErr;

      if(price && price>0 && form.status!=='لم يدفع بعد'){
        const opMap = {'اول سنة':'اشتراك جديد','تجديد':'تجديد'};
        const {error:revErr} = await sb.from('revenues').insert({
          date:form.start_date||todayISO(), customer_id:customerId, subscription_id:subData.id,
          operation_type:opMap[form.status]||'اشتراك جديد', program:form.program||null, server:form.server||null,
          quantity:1, price, total:price, notes:form.notes||null,
        });
        if(revErr) throw revErr;
      }

      showToast('تم إضافة الاشتراك بنجاح');
      setLastSaved({name:customerName, program:form.program, server:form.server, price, source_sheet:form.source_sheet, start_date:form.start_date});
      setForm({...blank, source_sheet: form.source_sheet});
      setCustQ('');
      await reload();
    }catch(ex){
      showToast(ex.message,'err');
      setLastSaved({error:ex.message});
    }
    finally{ setBusy(false); }
  }

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">اشتراك جديد</div>
          <div className="page-subtitle">أدخلي بيانات الاشتراك — سواء لعميل موجود أو عميل جديد بالكامل</div>
        </div>
      </div>

      <form onSubmit={submit} className="panel" style={{maxWidth:760}}>
        {lastSaved && !lastSaved.error && lastSaved.name && (
          <div style={{background:'var(--green-soft)', color:'var(--green)', padding:'12px 16px', borderRadius:10, marginBottom:16, fontSize:13.5, fontWeight:600}}>
            ✅ تم الحفظ بنجاح — {lastSaved.name} — {lastSaved.program||'بدون برنامج'} — {fmtEUR(lastSaved.price)} — ضمن {lastSaved.source_sheet} — بتاريخ {fmtDate(lastSaved.start_date)}.
            <div style={{fontWeight:400, marginTop:4}}>تقدري تلاقيه الآن بصفحة "{lastSaved.source_sheet.replace('اشتراك ','اشتراكات ')}".</div>
          </div>

function NotRenewedPage({customers, subscriptions, reload, showToast, canWrite}){
  const custMap = useMemo(()=>{ const m={}; customers.forEach(c=>m[c.id]=c); return m; },[customers]);
  const latestMap = useMemo(()=>latestSubscriptionPerCustomer(subscriptions), [subscriptions]);
  const rows = useMemo(()=> Object.values(latestMap)
    .map(s=>({...s, days:daysUntil(s.end_date)}))
    .filter(s=> s.days!==null && s.days<0)
    .sort((a,b)=> a.days - b.days)
  , [latestMap]);

  const [q,setQ] = useState('');
  const [renewing,setRenewing] = useState(null);

  const filtered = useMemo(()=>{
    const term = q.trim().toLowerCase();
    if(!term) return rows;
    return rows.filter(s=> (custMap[s.customer_id]?.name||'').toLowerCase().includes(term) || (custMap[s.customer_id]?.phone||'').includes(term));
  },[rows,q,custMap]);

  async function saveRenewal(form){
    try{
      const payload = {
        customer_id: form.customer_id, mac_address: form.mac_address||null, program: form.program||null, server: form.server||null,
        status:'تجديد', start_date: form.start_date||null, end_date: form.end_date||null,
        price: form.price===''?null:Number(form.price), cost: form.cost===''?null:Number(form.cost),
        payment_method: form.payment_method||null, notes: form.notes||null, source_sheet: `اشتراك ${(form.start_date||todayISO()).slice(0,4)}`,
      };
      const {error} = await sb.from('subscriptions').insert(payload);
      if(error) throw error;
      showToast('تم تسجيل التجديد بنجاح'); setRenewing(null); reload();
    }catch(ex){ showToast(ex.message,'err'); }

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">لم يجدد</div>

        <table>
          <thead><tr><th>اسم العميل</th><th>رقم الهاتف</th><th>الباقة</th><th>السيرفر</th><th>تاريخ الانتهاء</th><th>منذ كم يوم</th><th>آخر سعر</th><th></th></tr></thead>

                  <td style={{fontWeight:600}}>{c?.name||'—'}</td>
                  <td>{c?.phone||'—'}</td>
                  <td>{s.program||'—'}</td>
                  <td>{s.server||'—'}</td>
                  <td>{fmtDate(s.end_date)}</td>
                  <td><span className="badge badge-gray">{Math.abs(s.days)} يوم</span></td>

function MonthlySalesPage({revenues}){
  const barRef = useRef();
  const months = useMemo(()=>{
    const set = new Set();
    revenues.forEach(r=> r.date && set.add(r.date.slice(0,7)));
    return Array.from(set).sort();
  },[revenues]);

  const rows = months.map(m=>{
    const monthRevs = revenues.filter(r=>monthKey(r.date)===m);
    const total = monthRevs.reduce((s,r)=>s+Number(r.total||0),0);
    const count = monthRevs.length;
    const byType = {};
    monthRevs.forEach(r=>{ byType[r.operation_type] = (byType[r.operation_type]||0) + Number(r.total||0); });
    return {m, total, count, byType};
  }).reverse();

  const chartLabels = months.map(m=>{
    const [y,mo] = m.split('-');
    return new Intl.DateTimeFormat('ar-EG',{month:'short'}).format(new Date(y,mo-1,1)) + ' ' + y.slice(2);
  });
  useChart(barRef, {
    type:'bar',
    data:{ labels:chartLabels, datasets:[{label:'المبيعات', data:months.map(m=>revenues.filter(r=>monthKey(r.date)===m).reduce((s,r)=>s+Number(r.total||0),0)), backgroundColor:'#0e5352'}] },
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{ticks:{callback:v=>'€'+v}}}}
  }, [months.join(','), revenues.length]);

  const grandTotal = revenues.reduce((s,r)=>s+Number(r.total||0),0);

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">المبيعات الشهرية</div>
          <div className="page-subtitle">إجمالي كل المبيعات: {fmtEUR(grandTotal)}</div>
        </div>
      </div>
      <div className="panel">
        <div className="panel-title">المبيعات حسب الشهر</div>
        <div className="chart-box" style={{height:280}}><canvas ref={barRef}></canvas></div>
      </div>
      <div className="table-wrap">
        <table>
          <thead><tr><th>الشهر</th><th>عدد العمليات</th><th>إجمالي المبيعات</th></tr></thead>
          <tbody>
            {rows.map(r=>(
              <tr key={r.m}><td>{r.m}</td><td>{r.count}</td><td style={{fontWeight:700}}>{fmtEUR(r.total)}</td></tr>
            ))}
            {rows.length===0 && <tr><td colSpan={3}><div className="empty-state">لا توجد بيانات مبيعات بعد</div></td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function SubscriptionsPage({year, customers, subscriptions, reload, showToast, canWrite}){
  const sourceSheet = `اشتراك ${year}`;
  // نعتمد مباشرة على سنة "تاريخ الاشتراك" الفعلي بدل حقل source_sheet، لضمان التطابق دايماً
  const yearSubs = useMemo(()=> subscriptions.filter(s=> (s.start_date && s.start_date.startsWith(String(year))) || (!s.start_date && s.source_sheet===sourceSheet)), [subscriptions, sourceSheet, year]);
  const custMap = useMemo(()=>{ const m={}; customers.forEach(c=>m[c.id]=c); return m; },[customers]);

  const [q,setQ] = useState('');
  const [statusFilter,setStatusFilter] = useState('');
  const [adding,setAdding] = useState(false);
  const [editing,setEditing] = useState(null);
  const [deleting,setDeleting] = useState(null);

  const filtered = useMemo(()=>{
    let list = yearSubs;
    const term=q.trim().toLowerCase();
    if(term) list = list.filter(s => (custMap[s.customer_id]?.name||'').toLowerCase().includes(term) || (s.mac_address||'').toLowerCase().includes(term));
    if(statusFilter) list = list.filter(s=>s.status===statusFilter);
    return list.slice().sort((a,b)=>new Date(b.start_date||0)-new Date(a.start_date||0));
  },[yearSubs,q,statusFilter,custMap]);

  async function save(form){
    try{
      let customerId = form.customer_id;
      if(!customerId && form.__newCustomerName){
        const {data,error} = await sb.from('customers').insert({name:form.__newCustomerName}).select().single();
        if(error) throw error;
        customerId = data.id;
      }
      if(!customerId){ showToast('الرجاء اختيار عميل أو إدخال اسم عميل جديد','err'); return; }
      const payload = {
        customer_id: customerId, mac_address: form.mac_address||null, program: form.program||null, server: form.server||null,
        status: form.status||null, start_date: form.start_date||null, end_date: form.end_date||null,
        price: form.price===''?null:Number(form.price), cost: form.cost===''?null:Number(form.cost),
        payment_method: form.payment_method||null, notes: form.notes||null, source_sheet: form.source_sheet||sourceSheet,
      };
      if(form.id){
        const {error} = await sb.from('subscriptions').update(payload).eq('id',form.id);
        if(error) throw error;
      } else {
        const {error} = await sb.from('subscriptions').insert(payload);
        if(error) throw error;
      }
      showToast('تم حفظ الاشتراك'); setAdding(false); setEditing(null); reload();
    }catch(ex){ showToast(ex.message,'err'); }
  }

  async function del(id){
    try{
      const {error} = await sb.from('subscriptions').delete().eq('id',id);
      if(error) throw error;
      showToast('تم حذف الاشتراك'); setDeleting(null); reload();
    }catch(ex){ showToast(ex.message,'err'); }
  }

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">اشتراكات {year}</div>
          <div className="page-subtitle">{yearSubs.length} اشتراك مسجّل لسنة {year}</div>
        </div>
        {canWrite && <button className="btn btn-gold" onClick={()=>setAdding(true)}>+ إضافة اشتراك</button>}
      </div>

      <div className="toolbar">
        <input className="search-input" placeholder="ابحث بالاسم أو الماك ادرس..." value={q} onChange={e=>setQ(e.target.value)} />
        <select className="filter-select" value={statusFilter} onChange={e=>setStatusFilter(e.target.value)}>
          <option value="">كل الحالات</option>
          {STATUS_OPTIONS.map(s=><option key={s} value={s}>{s}</option>)}
        </select>
      </div>

      <div className="table-wrap">
        <table>
          <thead><tr>
            <th>العميل</th><th>الهاتف</th><th>ماك ادرس</th><th>البرنامج</th><th>السيرفر</th><th>الحالة</th><th>البداية</th><th>النهاية</th><th>السعر</th><th>التكلفة</th><th>طريقة الدفع</th><th></th>
          </tr></thead>
          <tbody>
            {filtered.map(s=>{
              const c = custMap[s.customer_id];
              return (
                <tr key={s.id}>
                  <td style={{fontWeight:600}}>{c?.name||'—'}</td>
                  <td>{c?.phone||'—'}</td>
                  <td style={{fontFamily:'monospace',fontSize:12}}>{s.mac_address||'—'}</td>
                  <td>{s.program||'—'}</td>
                  <td>{s.server||'—'}</td>
                  <td>{s.status||'—'}</td>
                  <td>{fmtDate(s.start_date)}</td>
                  <td>{fmtDate(s.end_date)}</td>
                  <td>{fmtEUR(s.price)}</td>
                  <td>{fmtEUR(s.cost)}</td>
                  <td>{s.payment_method||'—'}</td>
                  <td>
                    {canWrite && <>
                      <button className="icon-btn" onClick={()=>setEditing(s)}>✎</button>
                      <button className="icon-btn" onClick={()=>setDeleting(s)}>🗑</button>
                    </>}
                  </td>
                </tr>
              );
            })}
            {filtered.length===0 && <tr><td colSpan={12}><div className="empty-state"><div className="ic">📄</div>لا توجد اشتراكات مطابقة</div></td></tr>}
          </tbody>
        </table>
      </div>

      {(adding || editing) && <SubscriptionForm initial={editing} customers={customers} sourceSheet={sourceSheet} onSave={save} onCancel={()=>{setAdding(false);setEditing(null);}} />}
      {deleting && <ConfirmBar text="سيتم حذف هذا الاشتراك نهائياً." onConfirm={()=>del(deleting.id)} onCancel={()=>setDeleting(null)} />}
    </div>
  );
}

function PaymentMethodsPage({customers, subscriptions, revenues}){

      )}

  );

function DistributorsPage({distributors, reload, showToast, canWrite}){
  const [adding,setAdding]=useState(false);
  const [editing,setEditing]=useState(null);
  const [deleting,setDeleting]=useState(null);
  const [purchasing,setPurchasing]=useState(null);
  const [onlyFollowUp,setOnlyFollowUp]=useState(false);

  function needsFollowUp(d){
    const pd = PERIOD_DAYS[d.usual_period];
    if(!pd || !d.last_purchase_date) return false;
    const due = new Date(d.last_purchase_date); due.setDate(due.getDate()+pd);
    return due <= new Date(todayISO());
  }

  const list = onlyFollowUp ? distributors.filter(needsFollowUp) : distributors;
  const followUpCount = distributors.filter(needsFollowUp).length;

  async function save(form){
    try{
      const payload = {name:form.name, phone:form.phone||null, server_type:form.server_type||null,
        distributor_price: form.distributor_price===''?null:Number(form.distributor_price),
        usual_quantity: form.usual_quantity===''?null:Number(form.usual_quantity),
        last_purchase_date: form.last_purchase_date||null,
        last_purchase_value: form.last_purchase_value===''?null:Number(form.last_purchase_value),
        usual_period: form.usual_period||null, notes: form.notes||null};
      if(form.id){
        const {error} = await sb.from('distributors').update(payload).eq('id',form.id);
        if(error) throw error;
      } else {
        const {error} = await sb.from('distributors').insert(payload);
        if(error) throw error;
      }
      showToast('تم حفظ بيانات الموزع'); setAdding(false); setEditing(null); reload();
    }catch(ex){ showToast(ex.message,'err'); }
  }

  async function del(id){
    try{
      const {error} = await sb.from('distributors').delete().eq('id',id);
      if(error) throw error;
      showToast('تم حذف الموزع'); setDeleting(null); reload();
    }catch(ex){ showToast(ex.message,'err'); }
  }

  async function savePurchase(dist, form){
    try{
      const {error:e1} = await sb.from('distributor_purchases').insert({distributor_id:dist.id, purchase_date:form.purchase_date, quantity:Number(form.quantity)||0, price:Number(form.price)||0, total:form.total, notes:form.notes||null});
      if(e1) throw e1;
      const {error:e2} = await sb.from('distributors').update({last_purchase_date:form.purchase_date, last_purchase_value:form.total}).eq('id',dist.id);
      if(e2) throw e2;
      const {error:e3} = await sb.from('revenues').insert({date:form.purchase_date, operation_type:'بيع لموزع', quantity:Number(form.quantity)||0, price:Number(form.price)||0, total:form.total, notes:`عملية شراء موزع: ${dist.name}`});
      if(e3) throw e3;
      showToast('تم تسجيل العملية وربطها بالإيرادات'); setPurchasing(null); reload();
    }catch(ex){ showToast(ex.message,'err'); }
  }

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">الموزعون</div>
          <div className="page-subtitle">{distributors.length} موزع — {followUpCount} يحتاج متابعة</div>
        </div>
        {canWrite && <button className="btn btn-gold" onClick={()=>setAdding(true)}>+ إضافة موزع</button>}
      </div>

      <div className="toolbar">
        <button className={"btn btn-sm "+(onlyFollowUp?'btn-primary':'btn-ghost')} onClick={()=>setOnlyFollowUp(v=>!v)}>موزعون يحتاجون إلى متابعة ({followUpCount})</button>
      </div>

      <div className="table-wrap">
        <table>
          <thead><tr>
            <th>الاسم</th><th>الهاتف</th><th>نوع السيرفر</th><th>سعر الموزع</th><th>الكمية</th><th>آخر شراء</th><th>قيمة آخر عملية</th><th>الفترة المعتادة</th><th>الحالة</th><th></th>
          </tr></thead>
          <tbody>
            {list.map(d=>(
              <tr key={d.id}>
                <td style={{fontWeight:600}}>{d.name}</td>
                <td>{d.phone||'—'}</td>
                <td>{d.server_type||'—'}</td>
                <td>{fmtEUR(d.distributor_price)}</td>
                <td>{d.usual_quantity??'—'}</td>
                <td>{fmtDate(d.last_purchase_date)}</td>
                <td>{fmtEUR(d.last_purchase_value)}</td>
                <td>{d.usual_period||'—'}</td>
                <td>{needsFollowUp(d) ? <span className="badge badge-amber">يحتاج متابعة</span> : <span className="badge badge-green">منتظم</span>}</td>
                <td>
                  {canWrite && <>
                    <button className="btn btn-primary btn-sm" onClick={()=>setPurchasing(d)}>تسجيل عملية</button>
                    <button className="icon-btn" onClick={()=>setEditing(d)}>✎</button>
                    <button className="icon-btn" onClick={()=>setDeleting(d)}>🗑</button>
                  </>}
                </td>
              </tr>
            ))}
            {list.length===0 && <tr><td colSpan={10}><div className="empty-state"><div className="ic">🏬</div>لا يوجد موزعون</div></td></tr>}
          </tbody>
        </table>
      </div>

      {(adding || editing) && <DistributorForm initial={editing} onSave={save} onCancel={()=>{setAdding(false);setEditing(null);}} />}
      {purchasing && <DistPurchaseForm distributor={purchasing} onSave={(f)=>savePurchase(purchasing,f)} onCancel={()=>setPurchasing(null)} />}
      {deleting && <ConfirmBar text={`سيتم حذف الموزع "${deleting.name}" نهائياً.`} onConfirm={()=>del(deleting.id)} onCancel={()=>setDeleting(null)} />}
    </div>
  );
}

function ExpensesPage({expenses, reload, showToast, canWrite}){
  const [adding,setAdding]=useState(false);
  const [editing,setEditing]=useState(null);
  const [deleting,setDeleting]=useState(null);
  const [typeFilter,setTypeFilter]=useState('');
  const [from,setFrom]=useState(''); const [to,setTo]=useState('');

  const filtered = useMemo(()=>{
    let list = expenses;
    if(typeFilter) list = list.filter(e=>e.expense_type===typeFilter);
    if(from) list = list.filter(e=>e.date>=from);
    if(to) list = list.filter(e=>e.date<=to);
    return list.slice().sort((a,b)=>new Date(b.date)-new Date(a.date));
  },[expenses,typeFilter,from,to]);
  const total = filtered.reduce((s,e)=>s+Number(e.amount||0),0);

  async function save(form){
    try{
      const payload = {date:form.date, expense_type:form.expense_type, description:form.description||null, amount:Number(form.amount)||0, notes:form.notes||null};
      if(form.id){
        const {error} = await sb.from('expenses').update(payload).eq('id',form.id);
        if(error) throw error;
      } else {
        const {error} = await sb.from('expenses').insert(payload);
        if(error) throw error;
      }
      showToast('تم حفظ المصروف'); setAdding(false); setEditing(null); reload();
    }catch(ex){ showToast(ex.message,'err'); }
  }
  async function del(id){
    try{
      const {error} = await sb.from('expenses').delete().eq('id',id);
      if(error) throw error;
      showToast('تم حذف المصروف'); setDeleting(null); reload();
    }catch(ex){ showToast(ex.message,'err'); }
  }

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">المصاريف</div>
          <div className="page-subtitle">{filtered.length} مصروف — الإجمالي {fmtEUR(total)}</div>
        </div>
        {canWrite && <button className="btn btn-gold" onClick={()=>setAdding(true)}>+ إضافة مصروف</button>}
      </div>
      <div className="toolbar">
        <select className="filter-select" value={typeFilter} onChange={e=>setTypeFilter(e.target.value)}>
          <option value="">كل الأنواع</option>
          {EXPENSE_TYPES.map(t=><option key={t} value={t}>{t}</option>)}
        </select>
        <input type="date" className="filter-select" value={from} onChange={e=>setFrom(e.target.value)} />
        <span style={{color:'var(--ink-soft)',fontSize:13}}>إلى</span>
        <input type="date" className="filter-select" value={to} onChange={e=>setTo(e.target.value)} />
      </div>
      <div className="table-wrap">
        <table>
          <thead><tr><th>التاريخ</th><th>النوع</th><th>الوصف</th><th>المبلغ</th><th>ملاحظات</th><th></th></tr></thead>
          <tbody>
            {filtered.map(e=>(
              <tr key={e.id}>
                <td>{fmtDate(e.date)}</td>
                <td><span className="badge badge-gray">{e.expense_type}</span></td>
                <td>{e.description||'—'}</td>
                <td style={{fontWeight:700, color:'var(--red)'}}>{fmtEUR(e.amount)}</td>
                <td>{e.notes||'—'}</td>
                <td>{canWrite && <><button className="icon-btn" onClick={()=>setEditing(e)}>✎</button><button className="icon-btn" onClick={()=>setDeleting(e)}>🗑</button></>}</td>
              </tr>
            ))}
            {filtered.length===0 && <tr><td colSpan={6}><div className="empty-state"><div className="ic">🧾</div>لا توجد مصاريف مطابقة</div></td></tr>}
          </tbody>
        </table>
      </div>
      {(adding || editing) && <ExpenseForm initial={editing} onSave={save} onCancel={()=>{setAdding(false);setEditing(null);}} />}
      {deleting && <ConfirmBar text="سيتم حذف هذا المصروف نهائياً." onConfirm={()=>del(deleting.id)} onCancel={()=>setDeleting(null)} />}
    </div>
  );
}

function ProfitLossPage({revenues, expenses}){
  const [view,setView] = useState('monthly');
  const [customFrom,setCustomFrom] = useState('');
  const [customTo,setCustomTo] = useState('');
  const barRef = useRef();

  const years = ['2025','2026'];
  const yearTotals = years.map(y=>{
    const rev = revenues.filter(r=>r.date && r.date.startsWith(y)).reduce((s,r)=>s+Number(r.total||0),0);
    const exp = expenses.filter(e=>e.date && e.date.startsWith(y)).reduce((s,e)=>s+Number(e.amount||0),0);
    return {year:y, rev, exp, profit:rev-exp};
  });

  const monthsAll = useMemo(()=>{
    const set = new Set();
    revenues.forEach(r=> r.date && set.add(r.date.slice(0,7)));
    expenses.forEach(e=> e.date && set.add(e.date.slice(0,7)));
    return Array.from(set).sort();
  },[revenues,expenses]);

  const monthRows = monthsAll.map(m=>{
    const rev = revenues.filter(r=>monthKey(r.date)===m).reduce((s,r)=>s+Number(r.total||0),0);
    const exp = expenses.filter(e=>monthKey(e.date)===m).reduce((s,e)=>s+Number(e.amount||0),0);
    return {m, rev, exp, profit:rev-exp};
  });

  let customRev=0, customExp=0;
  if(view==='custom' && customFrom && customTo){
    customRev = revenues.filter(r=>r.date>=customFrom && r.date<=customTo).reduce((s,r)=>s+Number(r.total||0),0);
    customExp = expenses.filter(e=>e.date>=customFrom && e.date<=customTo).reduce((s,e)=>s+Number(e.amount||0),0);
  }

  useChart(barRef, {
    type:'bar',
    data:{ labels:years, datasets:[
      {label:'الإيرادات', data:yearTotals.map(y=>y.rev), backgroundColor:'#0e5352'},
      {label:'المصاريف', data:yearTotals.map(y=>y.exp), backgroundColor:'#a3323b'},
      {label:'صافي الربح', data:yearTotals.map(y=>y.profit), backgroundColor:'#b8862e'},

    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}}, scales:{y:{ticks:{callback:v=>'€'+v}}}}

  return (
    <div>
      <div className="page-header">
        <div>
          <div className="page-title">الأرباح والخسائر</div>
          <div className="page-subtitle">صافي الربح = الإيرادات − المصاريف</div>
        </div>
      </div>

      <div className="panel">
        <div className="panel-title">مقارنة 2025 مع 2026</div>
        <div className="chart-box" style={{height:260}}><canvas ref={barRef}></canvas></div>
      </div>

      <div className="tabs">
        <button className={"tab "+(view==='monthly'?'active':'')} onClick={()=>setView('monthly')}>شهرياً</button>
        <button className={"tab "+(view==='yearly'?'active':'')} onClick={()=>setView('yearly')}>سنوياً</button>
        <button className={"tab "+(view==='custom'?'active':'')} onClick={()=>setView('custom')}>فترة مخصصة</button>
      </div>

      {view==='yearly' && (
        <div className="table-wrap">
          <table><thead><tr><th>السنة</th><th>الإيرادات</th><th>المصاريف</th><th>صافي الربح</th></tr></thead>
            <tbody>{yearTotals.map(y=>(
              <tr key={y.year}><td style={{fontWeight:700}}>{y.year}</td><td>{fmtEUR(y.rev)}</td><td>{fmtEUR(y.exp)}</td>
              <td style={{fontWeight:700, color: y.profit>=0?'var(--green)':'var(--red)'}}>{fmtEUR(y.profit)}</td></tr>

          <table><thead><tr><th>الشهر</th><th>الإيرادات</th><th>المصاريف</th><th>صافي الربح</th></tr></thead>

function downloadCSV(filename, rows, headers){
  const esc = v => `"${String(v??'').replace(/"/g,'""')}"`;
  const csv = [headers.map(esc).join(',')].concat(rows.map(r=>headers.map(h=>esc(r[h])).join(','))).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click(); URL.revokeObjectURL(url);
}

function App(){
  const [session,setSession] = useState(undefined); // undefined = loading
  const [profile,setProfile] = useState(null);
  const [page,setPage] = useState('dashboard');
  const [mobileOpen,setMobileOpen] = useState(false);
  const [toast,showToast] = useToast();

  const [customers,setCustomers] = useState([]);
  const [subscriptions,setSubscriptions] = useState([]);
  const [distributors,setDistributors] = useState([]);
  const [revenues,setRevenues] = useState([]);
  const [expenses,setExpenses] = useState([]);
  const [dataLoaded,setDataLoaded] = useState(false);

  useEffect(()=>{
    sb.auth.getSession().then(({data})=> setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_e, s)=> setSession(s));
    return ()=> sub.subscription.unsubscribe();
  },[]);

  useEffect(()=>{
    if(!session){ setProfile(null); return; }
    sb.from('profiles').select('*').eq('id', session.user.id).single().then(({data,error})=>{
      if(!error) setProfile(data);
      else setProfile({full_name:session.user.email, role:'sales_employee'});
    });
  },[session]);

  async function loadAll(){
    const [c,s,d,r,e] = await Promise.all([
      sb.from('customers').select('*').order('name').range(0, 19999),
      sb.from('subscriptions').select('*').range(0, 19999),
      sb.from('distributors').select('*').order('name').range(0, 19999),
      sb.from('revenues').select('*').range(0, 19999),
      sb.from('expenses').select('*').range(0, 19999),
    ]);
    if(c.data) setCustomers(c.data);
    if(s.data) setSubscriptions(s.data);
    if(d.data) setDistributors(d.data);
    if(r.data) setRevenues(r.data);
    if(e.data) setExpenses(e.data);
    setDataLoaded(true);
  }

  useEffect(()=>{ if(session) loadAll(); }, [session]);

  if(session===undefined){
    return <div className="login-wrap"><div style={{color:'#fff',fontSize:14}}>جارٍ التحميل...</div></div>;
  }
  if(!session){
    return <LoginScreen />;
  }

  const canWrite = profile ? profile.role !== 'viewer' : false;

  async function logout(){ await sb.auth.signOut(); }

  let content = null;
  if(!dataLoaded){
    content = <div className="empty-state">جارٍ تحميل البيانات...</div>;
  } else if(page==='dashboard'){
    content = <Dashboard customers={customers} subscriptions={subscriptions} revenues={revenues} expenses={expenses} distributors={distributors} />;
  } else if(page==='newSub'){
    content = <NewSubscriptionPage customers={customers} subscriptions={subscriptions} reload={loadAll} showToast={showToast} setPage={setPage} />;
  } else if(page==='customers'){
    content = <CustomersPage customers={customers} subscriptions={subscriptions} reload={loadAll} showToast={showToast} canWrite={canWrite} />;
  } else if(page==='subs2025'){
    content = <SubscriptionsPage year="2025" customers={customers} subscriptions={subscriptions} reload={loadAll} showToast={showToast} canWrite={canWrite} />;
  } else if(page==='subs2026'){
    content = <SubscriptionsPage year="2026" customers={customers} subscriptions={subscriptions} reload={loadAll} showToast={showToast} canWrite={canWrite} />;
  } else if(page==='renewals'){
    content = <RenewalsPage customers={customers} subscriptions={subscriptions} reload={loadAll} showToast={showToast} canWrite={canWrite} />;
  } else if(page==='notRenewed'){
    content = <NotRenewedPage customers={customers} subscriptions={subscriptions} reload={loadAll} showToast={showToast} canWrite={canWrite} />;
  } else if(page==='unpaid'){
    content = <UnpaidPage customers={customers} subscriptions={subscriptions} reload={loadAll} showToast={showToast} canWrite={canWrite} />;
  } else if(page==='paymentMethods'){
    content = <PaymentMethodsPage customers={customers} subscriptions={subscriptions} revenues={revenues} />;
  } else if(page==='distributors'){
    content = <DistributorsPage distributors={distributors} reload={loadAll} showToast={showToast} canWrite={canWrite} />;
  } else if(page==='revenues'){
    content = <RevenuesPage revenues={revenues} customers={customers} reload={loadAll} showToast={showToast} canWrite={canWrite && (['super_admin','admin','accountant'].includes(profile?.role))} />;
  } else if(page==='expenses'){
    content = <ExpensesPage expenses={expenses} reload={loadAll} showToast={showToast} canWrite={canWrite && (['super_admin','admin','accountant'].includes(profile?.role))} />;
  } else if(page==='pnl'){
    content = <ProfitLossPage revenues={revenues} expenses={expenses} />;
  } else if(page==='monthlySales'){
    content = <MonthlySalesPage revenues={revenues} />;
  } else if(page==='subCosts'){
    content = <SubCostsPage customers={customers} subscriptions={subscriptions} />;
  } else if(page==='reports'){
    content = <ReportsPage customers={customers} subscriptions={subscriptions} revenues={revenues} expenses={expenses} distributors={distributors} />;
  }

  return (
    <div className="app-shell">
      <button className="mobile-toggle" onClick={()=>setMobileOpen(v=>!v)}>☰</button>
      <Sidebar page={page} setPage={setPage} profile={profile} onLogout={logout} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen} />
      <div className="main">{content}</div>
      <Toast toast={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
